[project]
name = "cleankoda"
version = "0.1.0"
description = "Coding agent harness for clean code software development"
readme = "README.md"
authors = [
    { name = "Thomas Weyrath", email = "tomwey2@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "litellm>=1.0.0",
    "pydantic>=2.0.0",
    "prompt-toolkit>=3.0.53",
    "rich>=15.0.0",
    "docker>=7.2.0",
    "mcp[cli]>=2.2.0",
]

[project.scripts]
cleankoda = "cleankoda.main:main"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "debugpy>=1.8.21",
    "pytest>=9.1.1",
]
